[settings]
trusted_config_paths = ["~/.config"]
minimum_release_age = "7d"
prefer_offline = true

idiomatic_version_file_enable_tools = ["node", "python"]

[tools]
deno = "latest"
node = "latest"
python = { version = "3.14", _.python.venv = { path = ".venv", create = true } }
uv = "latest"

difftastic = "latest"
fd = "latest"
fzf = "latest"
jq = "latest"
just = "latest"
lazygit = "latest"
neovim = "latest"
opencode = "latest"
ripgrep = "latest"
starship = "latest"
tree-sitter = "latest"
watchexec = "latest"
yazi = "latest"
zellij = "latest"
zoxide = "latest"

"github:ribru17/ts_query_ls" = "latest"
"npm:@microsoft/compose-language-service" = "latest"
"npm:@stylelint/language-server" = "latest"
"npm:@tailwindcss/language-server" = "latest"
"npm:@vtsls/language-server" = "latest"
"npm:bash-language-server" = "latest"
"npm:dockerfile-language-server-nodejs" = "latest"
"npm:graphql-language-service-cli" = "latest"
"npm:vim-language-server" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:yaml-language-server" = "latest"
"pipx:basedpyright" = "latest"
lua-language-server = "latest"
rust-analyzer = "latest"
shellcheck = "latest"
stylua = "latest"
tombi = "latest"
